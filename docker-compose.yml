services:
  flask_app:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    container_name: flask_app
    expose:
      - "5000"
    networks:
      - mynetwork

  nginx_proxy:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      pull: true
    container_name: nginx_proxy
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - flask_app
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
